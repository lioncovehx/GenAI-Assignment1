# Start everything: docker compose up --build, then open http://localhost:8080
services:
  backend:
    build:
      context: ./app/backend
      additional_contexts:
        models: ./models
    environment:
      MODELS_DIR: /models

  frontend:
    build: ./app/frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

  mlflow:
    build:
      context: .
      # No COPY, so BuildKit sends nothing from the context.
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN pip install --no-cache-dir mlflow==3.16.1
    command: mlflow ui --backend-store-uri sqlite:////mlflow/mlflow.db --host 0.0.0.0 --port 5000
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db:ro
    ports:
      - "127.0.0.1:5001:5000"
